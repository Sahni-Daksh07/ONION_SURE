services:
  postgres:
    image: postgres:16-alpine
    container_name: onion_sure_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onion_sure}
      POSTGRES_USER: ${POSTGRES_USER:-onion_sure_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onion_sure_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onion_sure_app} -d ${POSTGRES_DB:-onion_sure}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
